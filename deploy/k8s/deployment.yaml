apiVersion: apps/v1
kind: Deployment
metadata:
  name: siteinfo
  labels: {app.kubernetes.io/name: siteinfo}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: siteinfo}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels: {app.kubernetes.io/name: siteinfo}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
    spec:
      # Must exceed: preStop (5s) + shutdown_delay (5s) + http drain (<= handler timeout 45s)
      # + store close (<= load timeout 40s, overlaps the drain in practice). 120s leaves headroom.
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: siteinfo}
      containers:
        - name: siteinfo
          image: ghcr.io/OWNER/siteinfo:latest   # pin a version or digest
          args: ["serve"]
          ports:
            - {name: http, containerPort: 8080}
            - {name: metrics, containerPort: 9090}
          envFrom:
            - configMapRef: {name: siteinfo}
            - secretRef: {name: siteinfo}
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          # Liveness never touches Redis: a Redis outage must not restart pods.
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # Readiness pings Redis and fails while shutting down.
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 15
          lifecycle:
            preStop:
              # The image is distroless (no `sleep` binary), so the native sleep action is used
              # (Kubernetes >= 1.30). On older clusters drop this block: the app's own
              # SITEINFO_SERVER_SHUTDOWN_DELAY already keeps serving after readiness fails.
              sleep: {seconds: 5}
