# TEMPLATE ONLY: not part of kustomization.yaml. Create the real Secret out of band
# (kubectl create secret, Sealed Secrets, External Secrets, ...) and never commit values.
apiVersion: v1
kind: Secret
metadata:
  name: siteinfo
  labels: {app.kubernetes.io/name: siteinfo}
type: Opaque
stringData:
  SITEINFO_AUTH_TOKENS: "CHANGE_ME_token1,CHANGE_ME_token2"   # >= 16 chars each; two allow rotation
  SITEINFO_FIRECRAWL_API_KEY: "CHANGE_ME"
  SITEINFO_REDIS_PASSWORD: "CHANGE_ME"
