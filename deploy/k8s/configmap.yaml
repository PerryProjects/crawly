apiVersion: v1
kind: ConfigMap
metadata:
  name: siteinfo
  labels: {app.kubernetes.io/name: siteinfo}
data:
  SITEINFO_ENV: production
  SITEINFO_LOG_LEVEL: info
  SITEINFO_REDIS_MODE: cluster
  # Seed nodes of the self-hosted Redis Cluster; adjust to your cluster.
  SITEINFO_REDIS_ADDRS: redis-cluster-0.redis-cluster-headless:6379,redis-cluster-1.redis-cluster-headless:6379,redis-cluster-2.redis-cluster-headless:6379
  SITEINFO_FIRECRAWL_MAX_CONCURRENCY: "4"
  # Keep these in sync with terminationGracePeriodSeconds in deployment.yaml.
  SITEINFO_SERVER_SHUTDOWN_DELAY: 5s
  SITEINFO_SERVER_SHUTDOWN_TIMEOUT: 50s
  SITEINFO_CACHE_CLOSE_TIMEOUT: 45s
