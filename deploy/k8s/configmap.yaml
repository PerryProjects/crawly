apiVersion: v1
kind: ConfigMap
metadata:
  name: siteinfo
  labels: {app.kubernetes.io/name: siteinfo}
data:
  SITEINFO_ENV: production
  SITEINFO_LOG_LEVEL: info
  SITEINFO_REDIS_MODE: cluster
  # Seed nodes of the self-hosted Redis Cluster; adjust to your cluster.
  SITEINFO_REDIS_ADDRS: redis-cluster-0.redis-cluster-headless:6379,redis-cluster-1.redis-cluster-headless:6379,redis-cluster-2.redis-cluster-headless:6379
  SITEINFO_FIRECRAWL_MAX_CONCURRENCY: "4"
  # Metrics are pushed over OTLP/HTTP to a collector (there is no /metrics endpoint).
  SITEINFO_OTEL_EXPORTER: otlp
  SITEINFO_OTEL_ENDPOINT: http://otel-collector.observability:4318
  # Client IPs come from X-Forwarded-For ONLY for these proxy ranges (set to your ingress controller's pod CIDR).
  # Left empty, every client looks like the ingress and the per-IP limits below would throttle everyone together.
  SITEINFO_SERVER_TRUSTED_PROXIES: ""
  SITEINFO_PROTECT_IP_RATE: "50"
  SITEINFO_PROTECT_IP_BURST: "100"
  SITEINFO_PROTECT_MAX_INFLIGHT_REQUESTS: "256"
  SITEINFO_PROTECT_MAX_CONCURRENT_LOADS: "8"
  SITEINFO_PROTECT_LOAD_RATE: "2"
  # Keep these in sync with terminationGracePeriodSeconds in deployment.yaml.
  SITEINFO_SERVER_SHUTDOWN_DELAY: 5s
  SITEINFO_SERVER_SHUTDOWN_TIMEOUT: 50s
  SITEINFO_CACHE_CLOSE_TIMEOUT: 45s
