apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: siteinfo
  labels: {app.kubernetes.io/name: siteinfo}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: siteinfo}
  minReplicas: 2
  maxReplicas: 6
  metrics:
    # Work is I/O bound (waiting for Firecrawl); CPU is a weak signal. Consider a custom
    # metric on siteinfo.loads.inflight (via an OTel Collector -> metrics adapter / KEDA) once traffic is known.
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
